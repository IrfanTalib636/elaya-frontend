<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/assets/elaya-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elaya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap"
      rel="stylesheet"
    />
    <!-- Apply saved theme before React loads to prevent flash -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('elaya_theme') || '{}')
          var pref = (saved && saved.state && saved.state.preference) || 'system'
          var isDark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
